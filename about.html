<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Greek Mythology</title>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montagu+Slab:opsz,wght@16..144,100..700&display=swap" rel="stylesheet">
    <link href='https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/about.css">
</head>
<body>
    <header>
        <nav class="menu">
            <a href="index.html">HOME</a>
            <a href="favorites.html">FAVORITES</a>
            <a href="about.html">ABOUT</a>
        </nav>
    </header>

    <main class="about-container">
        <div class="about-hero">
            <h1 class="about-title">About Greek Mythology</h1>
            <div class="typewriter-container">
                <p id="typewriter-text" class="typewriter-text"></p>
                <span class="typewriter-cursor">|</span>
            </div>
        </div>

        <div class="about-stats">
            <div class="stat-card">
                <div class="stat-icon">⚡</div>
                <div class="stat-number" id="total-characters">0</div>
                <div class="stat-label">Characters</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏛️</div>
                <div class="stat-number" id="total-eras">0</div>
                <div class="stat-label">Eras</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-number" id="total-categories">0</div>
                <div class="stat-label">Categories</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💫</div>
                <div class="stat-number" id="avg-rating">0</div>
                <div class="stat-label">Average Rating</div>
            </div>
        </div>

        <div class="about-sections">
            <section class="about-section">
                <h2 class="section-title">Mythology Eras</h2>
                <div class="eras-timeline" id="eras-timeline"></div>
            </section>

            <section class="about-section">
                <h2 class="section-title">Main Categories</h2>
                <div class="categories-grid" id="categories-grid"></div>
            </section>
        </div>

        <div class="about-footer">
            <p class="footer-text">Explore the fascinating world of gods, heroes and creatures of Greek mythology</p>
            <a href="index.html" class="btn-explore">Explore Characters</a>
        </div>
    </main>

    <div class="particles-container" id="particles"></div>

    <span style="display: none;" class="theme-color">
        <i class='bx bx-toggle-right'></i> 
    </span>

    <script type="module" src="js/about.js"></script>
</body>
</html>
